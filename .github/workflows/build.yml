name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Needs Xcode 26+ to read this project's pbxproj format (object version 77).
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (unsigned)
        working-directory: osx
        run: ./build.sh Release

      - name: Zip app
        working-directory: osx
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/1passhole.app \
            1passhole-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1passhole-macos
          path: osx/1passhole-macos.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: osx/1passhole-macos.zip
          generate_release_notes: true
