name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Needs Xcode 26+ to read this project's pbxproj format (object version 77).
    # Pinned to an explicit image (not macos-latest) so a label migration can't
    # silently swap Xcode underneath us; bump this when GitHub retires macos-26.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Fail fast with a clear message if the runner image ever ships an older
      # default Xcode, instead of an opaque pbxproj parse error later.
      - name: Check Xcode version
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::Xcode 26+ required, runner default is Xcode $major. Update runs-on or select Xcode via xcode-select."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (unsigned)
        working-directory: osx
        run: ./build.sh Release

      - name: Zip app
        working-directory: osx
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/1passhole.app \
            1passhole-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: 1passhole-macos
          path: osx/1passhole-macos.zip
          retention-days: 30

      - name: Move rolling "latest-main" tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest-main
          git push -f origin latest-main

      - name: Publish rolling "latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-main
          name: "Latest build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          body: |
            Automated, unsigned build of the latest commit on `main`.

            Commit: ${{ github.sha }}

            This is a rolling release: the `latest-main` tag and its asset are
            replaced on every push to `main`. It is not a stable, versioned
            release — for those, see the tagged releases on the
            [Releases page](https://github.com/${{ github.repository }}/releases).

            **First launch:** this build is unsigned and not notarized, so
            Gatekeeper will block a plain double-click. Either right-click the
            app → "Open" and confirm, or run:
            `xattr -cr /path/to/1passhole.app`
          files: osx/1passhole-macos.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: osx/1passhole-macos.zip
          generate_release_notes: true
