name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Needs Xcode 26+ to read this project's pbxproj format (object version 77).
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (unsigned)
        working-directory: osx
        run: ./build.sh Release

      - name: Zip app
        working-directory: osx
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/1passhole.app \
            1passhole-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1passhole-macos
          path: osx/1passhole-macos.zip
          retention-days: 30

      - name: Move rolling "latest-main" tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest-main
          git push -f origin latest-main

      - name: Publish rolling "latest build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest build (main)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          body: |
            Automated, unsigned build of the latest commit on `main`.

            Commit: ${{ github.sha }}

            This is a rolling release: the `latest-main` tag and its asset are
            replaced on every push to `main`. It is not a stable, versioned
            release — for those, see the tagged releases on the
            [Releases page](https://github.com/${{ github.repository }}/releases).

            **First launch:** this build is unsigned and not notarized, so
            Gatekeeper will block a plain double-click. Either right-click the
            app → "Open" and confirm, or run:
            `xattr -cr /path/to/1passhole.app`
          files: osx/1passhole-macos.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: osx/1passhole-macos.zip
          generate_release_notes: true
