name: OnePasshole
options:
  bundleIdPrefix: com.1passhole
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  Argon2Swift:
    url: https://github.com/tmthecoder/Argon2Swift
    branch: main

targets:
  OnePasshole:
    type: application
    platform: macOS
    productName: 1passhole
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1passhole.osx
        PRODUCT_NAME: 1passhole
        PRODUCT_MODULE_NAME: OnePasshole
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OnePasshole.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Argon2Swift
    entitlements:
      path: Resources/OnePasshole.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.keychain-access-groups:
          - $(AppIdentifierPrefix)com.1passhole.shared
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.1passhole.osx
        com.apple.developer.icloud-services:
          - CloudKit

  OnePassholeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OnePasshole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1passhole.osx.tests
